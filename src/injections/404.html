<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found</title>
  <script>(()=>{const e=localStorage.getItem("theme");(e==="dark"||!e&&window.matchMedia("(prefers-color-scheme: dark)").matches)&&document.documentElement.classList.add("dark")})();</script>
  <style>.error,body{display:flex}.code,body{color:#171717}*{box-sizing:border-box}body,html{margin:0;min-height:100%}body{min-height:100vh;align-items:center;justify-content:center;background:#fff;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;transition:background .2s,color .2s}.error{align-items:center;justify-content:center;gap:18px}.code{font-size:clamp(4rem, 12vw, 7rem);line-height:1;font-weight:700;letter-spacing:-.08em}.separator{width:1px;height:64px;background:#d4d4d4}.message{font-size:15px;font-weight:500;color:#737373;text-align:left;line-height:1.5}html.dark body{background:#000;color:#ededed}html.dark .code{color:#fafafa}html.dark .separator{background:#333}html.dark .message{color:#888}@media (max-width:500px){.error{gap:12px}.separator{height:48px}.message{font-size:14px}}</style>
</head>
<body>
  <div class="error">
    <div class="code">404</div>
    <div class="separator"></div>
    <div class="message"> Page<br> Not Found </div>
  </div>
</body>
</html>
